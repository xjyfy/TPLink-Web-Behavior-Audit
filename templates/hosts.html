{% extends "base.html" %}
{% block title %}终端管理 - 网络日志分析{% endblock %}
{% block body %}
<h2>终端管理</h2>
<div class="panel">
  <div class="stat-row">
    <span class="stat-chip"><span class="stat-lbl">在线设备</span><b id="onlineCnt">-</b></span>
    <span class="stat-chip"><span class="stat-lbl">设备总数</span><b id="allCnt">-</b></span>
  </div>
  <p class="hint">根据 DHCP 日志自动维护 MAC 与当前 IP 的对应关系；备注为该终端使用人。最近 1 小时有访问记录视为在线。"最后在线"由该终端的日志活动自动更新；"长期离线"筛选按最后在线时间判断，从未有在线记录的设备也会被计入。</p>
  <div class="filterbar">
    <input id="hKw" placeholder="搜索 备注 / MAC / IP / 主机名">
    <button id="hSearch">搜索</button>
    <label style="display:flex;align-items:center;gap:6px;white-space:nowrap">长期离线
      <select id="hOffline" style="padding:4px;border:1px solid #ccc;border-radius:4px">
        <option value="">全部</option>
        <option value="30">1 个月以上未在线</option>
        <option value="90">3 个月以上未在线</option>
        <option value="180">6 个月以上未在线</option>
      </select>
    </label>
    <span style="flex:1"></span>
    <input type="file" id="hCsvFile" accept=".csv" style="display:none">
    <button id="hExport">导出CSV</button>
    <button id="hImport">导入CSV</button>
  </div>
  <div id="hImportMsg" class="upload-msg" style="margin-top:6px"></div>
</div>
<div class="panel">
  <div class="tbl-wrap">
  <table class="tbl">
    <thead><tr>
      <th>使用人备注</th><th>状态</th><th>MAC 地址</th><th>主机名</th><th>当前 IP</th><th>首次出现</th><th>最后在线</th><th>操作</th>
    </tr></thead>
    <tbody id="hostBody"></tbody>
  </table>
  </div>
  <div class="row-between" style="margin-top:10px">
    <span id="hTotal" class="hint"></span>
    <span class="pager">
      <button id="hPrev">上一页</button>
      <span id="hPageInfo"></span>
      <button id="hNext">下一页</button>
    </span>
  </div>
</div>
{% endblock %}
