{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block body %}
<h2>{{ title }}</h2>
<div class="panel">
  <div class="row-between">
    <span>
      <span id="fullTotal"></span>
      <span id="rangeHint" class="upload-msg"></span>
      <span id="uploadMsg" class="upload-msg"></span>
    </span>
    <span class="pager">
      <button id="prevBtn">上一页</button>
      <span id="pageInfo"></span>
      <button id="nextBtn">下一页</button>
    </span>
  </div>
  <div class="tbl-wrap">
  <table class="tbl">
    <thead><tr><th style="width:60px">#</th><th>名称</th><th style="width:120px">次数</th></tr></thead>
    <tbody id="fullBody"></tbody>
  </table>
  </div>
</div>
<input type="file" id="appIconFile" accept="image/*" style="display:none">
<div id="devModal" class="modal-mask" style="display:none">
  <div class="modal-box">
    <div class="modal-head">
      <span id="devModalTitle">使用终端</span>
      <button id="devModalClose" class="modal-close">×</button>
    </div>
    <div id="devModalSub" class="modal-sub"></div>
    <div class="modal-body" id="devBody"></div>
    <div class="modal-foot">
      <button id="devPrev">上一页</button>
      <span id="devPageInfo"></span>
      <button id="devNext">下一页</button>
    </div>
  </div>
</div>
<script>
const CHART = {{ chart_type|tojson }};
let pageNum = 1;
const SIZE = 20;
const SP = new URLSearchParams(location.search);
const RANGE = (SP.get('start') && SP.get('end'))
  ? `&start=${encodeURIComponent(SP.get('start'))}&end=${encodeURIComponent(SP.get('end'))}`
  : '';
const rangeHint = document.getElementById('rangeHint');
if (rangeHint) rangeHint.textContent = RANGE
  ? `（统计范围：${SP.get('start')} ~ ${SP.get('end')}）`
  : '（当前为全量统计）';
function load() {
  fetch('/api/stats/all/' + CHART + '?page=' + pageNum + '&size=' + SIZE + RANGE)
    .then(r=>r.json()).then(d => {
      const totalPages = Math.max(1, Math.ceil(d.total / SIZE));
      document.getElementById('fullTotal').textContent = '共 ' + d.total + ' 项';
      document.getElementById('pageInfo').textContent = '第 ' + d.page + ' / ' + totalPages + ' 页';
      document.getElementById('prevBtn').disabled = d.page <= 1;
      document.getElementById('nextBtn').disabled = d.page >= totalPages;
      document.getElementById('fullBody').innerHTML = d.rows.map((r,i) => {
        const name = r.k||'(空)';
        const isApps = CHART === 'apps';
        const icon = isApps
          ? `<img src="/app_icon/${encodeURIComponent(name)}" class="app-icon clickable-icon" data-app="${encodeURIComponent(name)}" title="点击上传/更换此应用的图标" onerror="this.style.opacity=0.15"> `
          : (CHART === 'app_categories'
              ? `<img src="/app_icon/${encodeURIComponent(name)}" class="app-icon" onerror="this.style.display='none'"> `
              : '');
        const nameCell = (CHART === 'app_categories')
          ? `<td class="cat-toggle" data-cat="${name}" title="点击展开该类别的具体应用">▸ ${icon}${name}</td>`
          : `<td>${icon}${name}</td>`;
        return `
        <tr>
          <td>${(d.page-1)*SIZE + i + 1}</td>
          ${nameCell}
          <td>${r.n}</td>
        </tr>`;
      }).join('');
      if (CHART === 'app_categories') bindCatToggles();
    });
}
function bindCatToggles() {
  const body = document.getElementById('fullBody');
  body.querySelectorAll('.cat-toggle').forEach(td => {
    td.onclick = async () => {
      const cat = td.getAttribute('data-cat');
      const tr = td.closest('tr');
      const isOpen = tr.classList.toggle('open');
      td.innerHTML = (isOpen ? '▾ ' : '▸ ') + td.innerHTML.slice(2);
      const old = tr.nextElementSibling;
      if (old && old.classList.contains('cat-detail')) old.remove();
      if (!isOpen) return;
      try {
        const d = await fetch('/api/stats/apps_in_category?category=' + encodeURIComponent(cat) + RANGE).then(r=>r.json());
        const apps = d.rows || [];
        const child = document.createElement('tr');
        child.className = 'cat-detail';
        child.innerHTML = `<td></td><td colspan="2" style="padding:6px 0 6px 30px;">${
          apps.length ? apps.map(a =>
            `<div class="cat-app-row"><span class="cat-app-name"><img src="/app_icon/${encodeURIComponent(a.k)}" class="app-icon" onerror="this.style.display='none'"> ${a.k}</span><span class="cat-app-count">${a.n}</span><a class="dev-count" data-app="${encodeURIComponent(a.k)}" title="点击查看使用该应用的终端设备">${a.devices||0} 台设备</a></div>`
          ).join('') : '<span style="color:#999">(该类别暂无具体应用数据)</span>'
        }</td>`;
        tr.after(child);
      } catch (err) {}
    };
  });
}
document.getElementById('prevBtn').onclick = () => { if(pageNum>1){pageNum--;load();} };
document.getElementById('nextBtn').onclick = () => { pageNum++; load(); };
(function(){
  const fileInput = document.getElementById('appIconFile');
  if (!fileInput || CHART !== 'apps') return;
  let upApp = null;
  const msg = document.getElementById('uploadMsg');
  function show(t){ if(msg) msg.textContent = t; }
  document.getElementById('fullBody').addEventListener('click', e => {
    const img = e.target.closest('img.clickable-icon');
    if (!img) return;
    upApp = decodeURIComponent(img.getAttribute('data-app'));
    show('选择图片即可作为「'+upApp+'」的图标...');
    fileInput.click();
  });
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files[0];
    fileInput.value = '';
    if (!f || !upApp) return;
    const fd = new FormData(); fd.append('file', f);
    show('正在上传「'+upApp+'」的图标...');
    try {
      const r = await fetch('/api/app_icon/' + encodeURIComponent(upApp), {method:'POST', body:fd}).then(r=>r.json());
      if (r.ok) {
        show('✔ 「'+upApp+'」图标已更新');
        document.querySelectorAll('img.clickable-icon').forEach(img => {
          if (img.getAttribute('data-app') === encodeURIComponent(upApp)) {
            img.src = '/app_icon/' + encodeURIComponent(upApp) + '?t=' + Date.now();
            img.style.opacity = '';
          }
        });
      } else {
        show('上传失败：' + (r.error||'未知错误'));
      }
    } catch (err) {
      show('上传失败，请重试');
    }
  });
})();
(function(){
  const mask = document.getElementById('devModal');
  const close = document.getElementById('devModalClose');
  const title = document.getElementById('devModalTitle');
  const sub = document.getElementById('devModalSub');
  const body = document.getElementById('devBody');
  const devPrev = document.getElementById('devPrev');
  const devNext = document.getElementById('devNext');
  const devPageInfo = document.getElementById('devPageInfo');
  const PAGE_SIZE = 20;
  let devApp = null, devPage = 1, devTotal = 0;

  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  async function loadDevices() {
    if (!devApp) return;
    const url = '/api/stats/app_devices?app=' + encodeURIComponent(devApp) + '&page=' + devPage + '&size=' + PAGE_SIZE + RANGE;
    const d = await fetch(url).then(r=>r.json());
    devTotal = d.total;
    const pages = Math.max(1, Math.ceil(d.total / PAGE_SIZE));
    title.textContent = '「' + devApp + '」使用终端';
    sub.textContent = '共 ' + d.total + ' 台设备' + (RANGE ? `（${SP.get('start')} ~ ${SP.get('end')}）` : '（全量）');
    devPageInfo.textContent = '第 ' + d.page + ' / ' + pages + ' 页';
    devPrev.disabled = d.page <= 1;
    devNext.disabled = d.page >= pages;
    const head = '<div class="dev-head"><span>MAC</span><span>IP</span><span>备注</span><span>次数</span></div>';
    body.innerHTML = d.rows.length
      ? head + d.rows.map(r =>
          `<div class="dev-row">
             <span class="dev-mac">${esc(r.mac)||'-'}</span>
             <span class="dev-ip">${esc(r.ip)}</span>
             <span class="dev-note">${esc(r.note)||'（无备注）'}</span>
             <span class="dev-n">${r.n} 次</span>
           </div>`).join('')
      : '<div class="dev-empty">该时间段内无使用记录</div>';
  }
  document.getElementById('fullBody').addEventListener('click', e => {
    const a = e.target.closest('a.dev-count');
    if (!a) return;
    devApp = decodeURIComponent(a.getAttribute('data-app'));
    devPage = 1;
    mask.style.display = 'flex';
    loadDevices();
  });
  close.onclick = () => { mask.style.display = 'none'; };
  mask.addEventListener('click', e => {
    if (e.target === mask || e.target.closest('.modal-close')) mask.style.display = 'none';
  });
  devPrev.onclick = () => { if (devPage > 1){ devPage--; loadDevices(); } };
  devNext.onclick = () => { devPage++; loadDevices(); };
})();
load();
</script>
{% endblock %}
