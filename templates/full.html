{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block body %}
<h2>{{ title }}</h2>
<div class="panel">
  <div class="row-between">
    <span>
      <span id="fullTotal"></span>
      <span id="rangeHint" class="upload-msg"></span>
      <span id="uploadMsg" class="upload-msg"></span>
    </span>
    <span class="pager">
      <button id="prevBtn">上一页</button>
      <span id="pageInfo"></span>
      <button id="nextBtn">下一页</button>
    </span>
  </div>
  <div class="tbl-wrap">
  <table class="tbl">
    <thead><tr><th style="width:60px">#</th><th>名称</th><th style="width:120px">次数</th></tr></thead>
    <tbody id="fullBody"></tbody>
  </table>
  </div>
</div>
<input type="file" id="appIconFile" accept="image/*" style="display:none">
<script>
const CHART = {{ chart_type|tojson }};
let pageNum = 1;
const SIZE = 20;
// 继承总览页打开时的时间范围（若无则按全量统计）
const SP = new URLSearchParams(location.search);
const RANGE = (SP.get('start') && SP.get('end'))
  ? `&start=${encodeURIComponent(SP.get('start'))}&end=${encodeURIComponent(SP.get('end'))}`
  : '';
const rangeHint = document.getElementById('rangeHint');
if (rangeHint) rangeHint.textContent = RANGE
  ? `（统计范围：${SP.get('start')} ~ ${SP.get('end')}）`
  : '（当前为全量统计）';
function load() {
  fetch('/api/stats/all/' + CHART + '?page=' + pageNum + '&size=' + SIZE + RANGE)
    .then(r=>r.json()).then(d => {
      const totalPages = Math.max(1, Math.ceil(d.total / SIZE));
      document.getElementById('fullTotal').textContent = '共 ' + d.total + ' 项';
      document.getElementById('pageInfo').textContent = '第 ' + d.page + ' / ' + totalPages + ' 页';
      document.getElementById('prevBtn').disabled = d.page <= 1;
      document.getElementById('nextBtn').disabled = d.page >= totalPages;
      document.getElementById('fullBody').innerHTML = d.rows.map((r,i) => {
        const name = r.k||'(空)';
        const isApps = CHART === 'apps';
        const icon = isApps
          ? `<img src="/app_icon/${encodeURIComponent(name)}" class="app-icon clickable-icon" data-app="${encodeURIComponent(name)}" title="点击上传/更换此应用的图标" onerror="this.style.opacity=0.15"> `
          : (CHART === 'app_categories'
              ? `<img src="/app_icon/${encodeURIComponent(name)}" class="app-icon" onerror="this.style.display='none'"> `
              : '');
        const nameCell = (CHART === 'app_categories')
          ? `<td class="cat-toggle" data-cat="${name}" title="点击展开该类别的具体应用">▸ ${icon}${name}</td>`
          : `<td>${icon}${name}</td>`;
        return `
        <tr>
          <td>${(d.page-1)*SIZE + i + 1}</td>
          ${nameCell}
          <td>${r.n}</td>
        </tr>`;
      }).join('');
      if (CHART === 'app_categories') bindCatToggles();
    });
}
// 应用类别：点击行展开该类别的具体应用
function bindCatToggles() {
  const body = document.getElementById('fullBody');
  body.querySelectorAll('.cat-toggle').forEach(td => {
    td.onclick = async () => {
      const cat = td.getAttribute('data-cat');
      const tr = td.closest('tr');
      const isOpen = tr.classList.toggle('open');
      td.innerHTML = (isOpen ? '▾ ' : '▸ ') + td.innerHTML.slice(2);
      const old = tr.nextElementSibling;
      if (old && old.classList.contains('cat-detail')) old.remove();
      if (!isOpen) return;
      try {
        const d = await fetch('/api/stats/apps_in_category?category=' + encodeURIComponent(cat) + RANGE).then(r=>r.json());
        const apps = d.rows || [];
        const child = document.createElement('tr');
        child.className = 'cat-detail';
        child.innerHTML = `<td></td><td colspan="2" style="padding:6px 0 6px 30px;">${
          apps.length ? apps.map(a =>
            `<div class="cat-app-row"><span><img src="/app_icon/${encodeURIComponent(a.k)}" class="app-icon" onerror="this.style.display='none'"> ${a.k}</span><span>${a.n}</span></div>`
          ).join('') : '<span style="color:#999">(该类别暂无具体应用数据)</span>'
        }</td>`;
        tr.after(child);
      } catch (err) {}
    };
  });
}
document.getElementById('prevBtn').onclick = () => { if(pageNum>1){pageNum--;load();} };
document.getElementById('nextBtn').onclick = () => { pageNum++; load(); };
// 应用图标点击上传（仅"热门应用"列表）
(function(){
  const fileInput = document.getElementById('appIconFile');
  if (!fileInput || CHART !== 'apps') return;
  let upApp = null;
  const msg = document.getElementById('uploadMsg');
  function show(t){ if(msg) msg.textContent = t; }
  document.getElementById('fullBody').addEventListener('click', e => {
    const img = e.target.closest('img.clickable-icon');
    if (!img) return;
    upApp = decodeURIComponent(img.getAttribute('data-app'));
    show('选择图片即可作为「'+upApp+'」的图标...');
    fileInput.click();
  });
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files[0];
    fileInput.value = '';
    if (!f || !upApp) return;
    const fd = new FormData(); fd.append('file', f);
    show('正在上传「'+upApp+'」的图标...');
    try {
      const r = await fetch('/api/app_icon/' + encodeURIComponent(upApp), {method:'POST', body:fd}).then(r=>r.json());
      if (r.ok) {
        show('✔ 「'+upApp+'」图标已更新');
        document.querySelectorAll('img.clickable-icon').forEach(img => {
          if (img.getAttribute('data-app') === encodeURIComponent(upApp)) {
            img.src = '/app_icon/' + encodeURIComponent(upApp) + '?t=' + Date.now();
            img.style.opacity = '';
          }
        });
      } else {
        show('上传失败：' + (r.error||'未知错误'));
      }
    } catch (err) {
      show('上传失败，请重试');
    }
  });
})();
load();
</script>
{% endblock %}
